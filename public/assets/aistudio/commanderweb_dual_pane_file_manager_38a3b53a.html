            </div>
            <div class="mt-4 p-3 rounded-xl bg-blue-500/10 border border-blue-500/20 text-[11px] text-blue-600 dark:text-blue-300">
              <strong>วิธีจัดการไฟล์ในเครื่องจริง:</strong> คลิกปุ่ม <span class="underline font-semibold">Open PC Folder</span> ที่หัวหน้าต่างซ้ายหรือขวา เพื่อเลือกโฟลเดอร์จาก Hard Drive ของคุณ แล้ว Copy/Move ข้ามไดรฟ์ได้ทันที!
            </div>
            <div class="flex justify-end mt-4">
              <button onclick="app.closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white">ปิดหน้าต่าง</button>
            </div>
          </div>
        `);
      }

      // =====================================================================
      // 8. UI RENDERING (PANES, INSPECTOR, LOGS, TOASTS)
      // =====================================================================
      renderPane(paneId) {
        const pane = this.panes[paneId];
        const container = document.getElementById(`pane-${paneId}`);
        const isActive = this.activePane === paneId;
        const breadcrumbs = pane.adapter.getBreadcrumbs();
        const visibleEntries = this.getFilteredEntries(paneId);
        const isLocal = pane.adapter.type === 'local';

        const totalSize = visibleEntries.reduce((acc, e) => acc + (e.kind === 'file' ? e.size : 0), 0);
        const selectedCount = pane.selected.size;
        const allSelected = visibleEntries.length > 0 && visibleEntries.every(e => pane.selected.has(e.name));

        const sortArrow = (col) => {
          if (pane.sortBy !== col) return '';
          return pane.sortAsc ? ' ▲' : ' ▼';
        };

        container.className = `flex-1 min-w-0 flex flex-col bg-white dark:bg-oc-surface transition-all relative ${
          isActive
            ? 'ring-2 ring-inset ring-blue-500/70'
            : 'opacity-95'
        }`;

        container.innerHTML = `
          <!-- PANE HEADER: DRIVE SOURCE & QUICK MOUNT -->
          <div class="px-3 py-2 border-b border-slate-200 dark:border-oc-border bg-slate-50/80 dark:bg-oc-panel/60 flex items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full shrink-0 ${isActive ? 'bg-blue-500 shadow-[0_0_8px_#3b82f6]' : 'bg-slate-400 dark:bg-slate-600'}"></span>
              <span class="text-[11px] font-bold uppercase tracking-wider ${isActive ? 'text-blue-600 dark:text-blue-400' : 'text-slate-500'}">
                ${paneId === 'left' ? 'Left Pane' : 'Right Pane'}
              </span>
              <span class="text-[10px] px-1.5 py-0.5 rounded-md font-medium ${
                isLocal
                  ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30'
                  : 'bg-purple-500/15 text-purple-600 dark:text-purple-400 border border-purple-500/30'
              }">
                ${isLocal ? 'PC Local Drive' : 'Virtual Sandbox'}
              </span>
            </div>

            <div class="flex items-center gap-1 shrink-0">
              <button onclick="event.stopPropagation(); app.mountLocalFolder('${paneId}')" title="เลือกโฟลเดอร์จริงจากเครื่องคอมพิวเตอร์" class="flex items-center gap-1 px-2 py-1 rounded-lg text-[11px] font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-xs transition">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"/></svg>
                <span>Open PC Folder</span>
              </button>
              ${isLocal ? `
                <button onclick="event.stopPropagation(); app.switchToVirtualDrive('${paneId}')" title="สลับกลับไปใช้ Virtual Drive" class="px-2 py-1 rounded-lg text-[11px] font-medium bg-slate-200 dark:bg-oc-surface hover:bg-slate-300 dark:hover:bg-oc-hover text-slate-700 dark:text-slate-300 transition">
                  V: Drive
                </button>
              ` : ''}
            </div>
          </div>

          <!-- BREADCRUMB & FILTER BAR -->
          <div class="px-2.5 py-1.5 border-b border-slate-200 dark:border-oc-border flex items-center gap-1.5 bg-white dark:bg-oc-surface shrink-0">
            <button onclick="event.stopPropagation(); app.navigateUp('${paneId}')" ${breadcrumbs.length <= 1 ? 'disabled' : ''} title="ขึ้นไป 1 โฟลเดอร์ (Backspace)" class="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-oc-hover disabled:opacity-30 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
            </button>

            <!-- Breadcrumb Path -->
            <div class="flex-1 flex items-center gap-1 overflow-x-auto bg-slate-100 dark:bg-oc-panel px-2.5 py-1 rounded-lg border border-slate-200/80 dark:border-oc-border text-xs no-scrollbar">
              ${breadcrumbs.map((crumb, idx) => `
                ${idx > 0 ? '<span class="text-slate-400">/</span>' : ''}
                <button onclick="event.stopPropagation(); app.navigateBreadcrumb('${paneId}', ${idx})" class="hover:text-blue-500 font-medium whitespace-nowrap transition ${idx === breadcrumbs.length - 1 ? 'text-slate-900 dark:text-white font-semibold' : 'text-slate-500 dark:text-slate-400'}">
                  ${escapeHTML(crumb.name)}
                </button>
              `).join('')}
            </div>

            <!-- Quick Search Filter -->
            <div class="relative w-28 sm:w-36 shrink-0">
              <input
                type="text"
                value="${escapeHTML(pane.filter)}"
                oninput="app.setFilter('${paneId}', this.value)"
                onclick="event.stopPropagation(); app.setActivePane('${paneId}')"
                placeholder="กรองชื่อ..."
                class="w-full pl-6 pr-2 py-1 text-xs rounded-lg bg-slate-100 dark:bg-oc-panel border border-slate-200 dark:border-oc-border text-slate-800 dark:text-slate-200 focus:outline-none focus:border-blue-500"
              />
              <svg class="w-3 h-3 text-slate-400 absolute left-2 top-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <button onclick="event.stopPropagation(); app.refreshPane('${paneId}')" title="รีเฟรชรายการไฟล์" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-oc-hover transition">
              <svg class="w-3.5 h-3.5 ${pane.loading ? 'animate-spin text-blue-500' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
          </div>

          <!-- FILE LIST TABLE HEADER -->
          <div class="grid grid-cols-12 gap-2 px-3 py-1.5 border-b border-slate-200 dark:border-oc-border bg-slate-50 dark:bg-oc-panel/40 text-[11px] font-semibold text-slate-500 dark:text-slate-400 no-select shrink-0">
            <div class="col-span-6 sm:col-span-6 flex items-center gap-2">
              <input type="checkbox" ${allSelected ? 'checked' : ''} onclick="event.stopPropagation(); app.toggleSelectAll('${paneId}')" class="rounded border-slate-400 text-blue-600 focus:ring-0 cursor-pointer" />
              <button onclick="event.stopPropagation(); app.toggleSort('${paneId}', 'name')" class="hover:text-slate-900 dark:hover:text-white truncate text-left">
                ชื่อ (Name)${sortArrow('name')}
              </button>
            </div>
            <div class="col-span-2 text-right">
              <button onclick="event.stopPropagation(); app.toggleSort('${paneId}', 'size')" class="hover:text-slate-900 dark:hover:text-white">
                ขนาด${sortArrow('size')}
              </button>
            </div>
            <div class="col-span-2 hidden sm:block">
              <button onclick="event.stopPropagation(); app.toggleSort('${paneId}', 'type')" class="hover:text-slate-900 dark:hover:text-white">
                ประเภท${sortArrow('type')}
              </button>
            </div>
            <div class="col-span-4 sm:col-span-2 text-right">
              <button onclick="event.stopPropagation(); app.toggleSort('${paneId}', 'date')" class="hover:text-slate-900 dark:hover:text-white">
                แก้ไขล่าสุด${sortArrow('date')}
              </button>
            </div>
          </div>

          <!-- FILE LIST ROWS (DROP ZONE) -->
          <div
            ondragover="app.handleDragOver(event, '${paneId}')"
            ondragleave="app.handleDragLeave(event, '${paneId}')"
            ondrop="app.handleDrop(event, '${paneId}')"
            class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-oc-border/50 no-select"
          >
            ${visibleEntries.length === 0 ? `
              <div class="h-full flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                <svg class="w-10 h-10 mb-2 opacity-40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                <p class="text-xs font-medium">${pane.filter ? 'ไม่พบไฟล์ที่ตรงกับคำค้นหา' : 'โฟลเดอร์นี้ว่างเปล่า'}</p>
                <p class="text-[11px] opacity-75 mt-1">ลากไฟล์จากอีกฝั่งมาวางที่นี่ หรือกด F7 เพื่อสร้างโฟลเดอร์</p>
              </div>
            ` : visibleEntries.map((entry, idx) => {
              const isSelected = pane.selected.has(entry.name);
              const safeName = escapeHTML(entry.name);
              const jsSafeName = entry.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
              return `
                <div
                  draggable="true"
                  ondragstart="app.handleDragStart(event, '${paneId}', '${jsSafeName}')"
                  onclick="app.handleRowClick(event, '${paneId}', ${idx}, '${jsSafeName}')"
                  ondblclick="app.openEntry('${paneId}', '${jsSafeName}')"
                  class="grid grid-cols-12 gap-2 px-3 py-1.5 items-center text-xs cursor-pointer transition-colors ${
                    isSelected
                      ? 'bg-blue-600/15 dark:bg-blue-500/25 text-blue-900 dark:text-white font-medium'
                      : 'hover:bg-slate-100 dark:hover:bg-oc-hover text-slate-700 dark:text-slate-200'
                  }"
                >
                  <div class="col-span-6 sm:col-span-6 flex items-center gap-2 min-w-0">
                    <input
                      type="checkbox"
                      ${isSelected ? 'checked' : ''}
                      onclick="app.toggleCheckbox(event, '${paneId}', ${idx}, '${jsSafeName}')"
                      class="rounded border-slate-400 text-blue-600 focus:ring-0 cursor-pointer shrink-0"
                    />
                    ${getFileIconSVG(entry)}
                    <span class="truncate" title="${safeName}">${safeName}</span>
                  </div>
                  <div class="col-span-2 text-right font-mono text-[11px] text-slate-500 dark:text-slate-400">
                    ${entry.kind === 'directory' ? '<DIR>' : formatBytes(entry.size)}
                  </div>
                  <div class="col-span-2 hidden sm:block text-[11px] text-slate-500 dark:text-slate-400 truncate">
                    ${getFileExtensionLabel(entry)}
                  </div>
                  <div class="col-span-4 sm:col-span-2 text-right text-[11px] text-slate-500 dark:text-slate-400 truncate">
                    ${formatDate(entry.lastModified)}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- PANE FOOTER STATUS -->
          <div class="px-3 py-1.5 border-t border-slate-200 dark:border-oc-border bg-slate-50 dark:bg-oc-panel/50 flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 shrink-0">
            <span>ทั้งหมด ${visibleEntries.length} รายการ (${formatBytes(totalSize)})</span>
            <span class="${selectedCount > 0 ? 'text-blue-600 dark:text-blue-400 font-semibold' : ''}">
              เลือกอยู่ ${selectedCount} รายการ
            </span>
          </div>
        `;
      }

      async updateInspector() {
        const container = document.getElementById('inspector-content');
        if (!this.inspectorVisible) return;

        const pane = this.panes[this.activePane];
        const selected = this.getSelectedEntries(this.activePane);

        if (selected.length === 0) {
          const crumbs = pane.adapter.getBreadcrumbs();
          const currentFolderName = crumbs[crumbs.length - 1].name;
          const dirCount = pane.entries.filter(e => e.kind === 'directory').length;
          const fileCount = pane.entries.filter(e => e.kind === 'file').length;
          container.innerHTML = `
            <div class="flex flex-col items-center text-center py-6">
              <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 mb-3">
                <svg class="w-9 h-9" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
              </div>
              <h3 class="text-sm font-bold text-slate-900 dark:text-white break-all">${escapeHTML(currentFolderName)}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${dirCount} โฟลเดอร์ • ${fileCount} ไฟล์</p>
            </div>
            <div class="p-3.5 rounded-xl bg-white dark:bg-oc-surface border border-slate-200 dark:border-oc-border text-xs space-y-2">
              <div class="font-semibold text-slate-700 dark:text-slate-200">คำแนะนำการใช้งาน</div>
              <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">
                คลิกเลือกไฟล์ทางฝั่งซ้ายหรือขวาเพื่อดูตัวอย่างรูปภาพ โค้ด หรือข้อความ และสามารถกด <strong>Copy (F5)</strong> หรือ <strong>Move (F6)</strong> เพื่อส่งไฟล์ข้ามหน้าต่างได้ทันที
              </p>
            </div>
          `;
          return;
        }

        if (selected.length > 1) {
          const totalBytes = selected.reduce((sum, item) => sum + item.size, 0);
          container.innerHTML = `
            <div class="flex flex-col items-center text-center py-6">
              <div class="w-16 h-16 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-500 mb-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg>
              </div>
              <h3 class="text-sm font-bold text-slate-900 dark:text-white">เลือกอยู่ ${selected.length} รายการ</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">ขนาดรวม: ${formatBytes(totalBytes)}</p>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="app.triggerCopy()" class="py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow">Copy ทั้งหมด (F5)</button>
              <button onclick="app.triggerMove()" class="py-2 px-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold shadow">Move ทั้งหมด (F6)</button>
            </div>
          `;
          return;
        }

        // Single item selected
        const item = selected[0];
        let previewHTML = '';

        if (item.kind === 'directory') {
          previewHTML = `
            <div class="h-36 rounded-xl bg-amber-500/10 border border-amber-500/20 flex flex-col items-center justify-center text-amber-400">
              <svg class="w-14 h-14" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
              <span class="text-[11px] font-medium mt-1">Directory / Folder</span>
            </div>
          `;
        } else {
          try {
            const blob = await pane.adapter.readFileBlob(item);
            const mime = item.mimeType || blob.type || guessMimeType(item.name);

            if (mime.startsWith('image/')) {
              const url = URL.createObjectURL(blob);
              previewHTML = `
                <div class="rounded-xl overflow-hidden border border-slate-200 dark:border-oc-border bg-slate-900/50 flex items-center justify-center p-2">
                  <img src="${url}" alt="${escapeHTML(item.name)}" class="max-h-52 w-auto object-contain rounded-lg" />
                </div>
              `;
            } else if (
              mime.startsWith('text/') ||
              mime === 'application/json' ||
              item.name.match(/\.(txt|md|json|js|ts|html|css|csv|xml|py|java|cpp|log)$/i)
            ) {
              const text = await blob.slice(0, 6000).text();
              previewHTML = `
                <div class="rounded-xl border border-slate-200 dark:border-oc-border bg-slate-900 text-slate-200 p-3 font-mono text-[11px] max-h-60 overflow-auto whitespace-pre-wrap leading-relaxed">${escapeHTML(text)}</div>
              `;
            } else {
              previewHTML = `
                <div class="h-32 rounded-xl bg-slate-200/50 dark:bg-oc-surface border border-slate-200 dark:border-oc-border flex flex-col items-center justify-center text-slate-400">
                  ${getFileIconSVG(item)}
                  <span class="text-[11px] mt-2">ไม่มีตัวอย่างสำหรับไฟล์ประเภทนี้</span>
                </div>
              `;
            }
          } catch (e) {
            previewHTML = `<div class="text-xs text-rose-400 p-3 rounded-xl bg-rose-500/10">ไม่สามารถอ่านตัวอย่างไฟล์ได้</div>`;
          }
        }

        container.innerHTML = `
          ${previewHTML}
          <div>
            <h3 class="text-sm font-bold text-slate-900 dark:text-white break-all">${escapeHTML(item.name)}</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">${getFileExtensionLabel(item)}</p>
          </div>
          <div class="rounded-xl bg-white dark:bg-oc-surface border border-slate-200 dark:border-oc-border p-3 text-xs space-y-2">
            <div class="flex justify-between">
              <span class="text-slate-500">ขนาดไฟล์:</span>
              <span class="font-mono font-medium text-slate-800 dark:text-slate-200">${item.kind === 'directory' ? 'Folder' : formatBytes(item.size)}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-500">แก้ไขล่าสุด:</span>
              <span class="text-slate-800 dark:text-slate-200">${formatDate(item.lastModified)}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-500">แหล่งข้อมูล:</span>
              <span class="text-slate-800 dark:text-slate-200">${pane.adapter.type === 'local' ? 'PC Local Drive' : 'Virtual Drive'}</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="app.triggerCopy()" class="py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow transition">Copy (F5)</button>
            <button onclick="app.triggerMove()" class="py-2 px-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold shadow transition">Move (F6)</button>
          </div>
        `;
      }

      swapPanes() {
        const temp = this.panes.left;
        this.panes.left = this.panes.right;
        this.panes.right = temp;
        this.panes.left.id = 'left';
        this.panes.right.id = 'right';
        this.activePane = this.getOppositePaneId(this.activePane);
        this.renderPane('left');
        this.renderPane('right');
        this.updateInspector();
        this.showToast('สลับตำแหน่งหน้าต่างซ้าย-ขวาแล้ว', 'info');
      }

      toggleInspector() {
        this.inspectorVisible = !this.inspectorVisible;
        const panel = document.getElementById('inspector-panel');
        if (this.inspectorVisible) {
          panel.classList.remove('hidden');
          this.updateInspector();
        } else {
          panel.classList.add('hidden');
        }
      }

      toggleTheme() {
        document.documentElement.classList.toggle('dark');
      }

      setProgressState(active, label = '', percent = 0) {
        const indicator = document.getElementById('task-status-indicator');
        const wrapper = document.getElementById('task-progress-wrapper');
        const bar = document.getElementById('task-progress-bar');
        const text = document.getElementById('task-progress-text');

        if (active) {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span><span>${escapeHTML(label)}</span>`;
          wrapper.classList.remove('hidden');
          wrapper.classList.add('flex');
          bar.style.width = `${percent}%`;
          text.textContent = `${percent}%`;
        } else {
          indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>พร้อมทำงาน (Ready)</span>`;
          wrapper.classList.add('hidden');
          wrapper.classList.remove('flex');
        }
      }

      addLog(message) {
        const time = new Date().toLocaleTimeString('th-TH');
        this.logs.unshift(`[${time}] ${message}`);
        document.getElementById('log-count').textContent = this.logs.length;
        document.getElementById('task-last-log').textContent = message;
        const panel = document.getElementById('task-logs-panel');
        panel.innerHTML = this.logs.map(l => `<div class="text-slate-600 dark:text-slate-300">${escapeHTML(l)}</div>`).join('');
      }

      toggleTaskLogs() {
        document.getElementById('task-logs-panel').classList.toggle('hidden');
      }

      showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const colors = {
          success: 'bg-emerald-600 text-white',
          error: 'bg-rose-600 text-white',
          warning: 'bg-amber-600 text-white',
          info: 'bg-slate-800 text-white dark:bg-oc-panel border border-oc-border'
        };
        const toast = document.createElement('div');
        toast.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium animate-slide-up ${colors[type] || colors.info}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.2s';
          setTimeout(() => toast.remove(), 200);
        }, 3200);
      }

      bindKeyboardShortcuts() {
        window.addEventListener('keydown', (e) => {
          // Ignore shortcuts when typing in input fields or when modal is open
          const tag = document.activeElement.tagName;
          const modalOpen = !document.getElementById('modal-backdrop').classList.contains('hidden');
          if (modalOpen) {
            if (e.key === 'Escape') this.closeModal();
            return;
          }
          if (tag === 'INPUT' || tag === 'TEXTAREA') {
            if (e.key === 'Escape') document.activeElement.blur();
            return;
          }

          if (e.key === 'Tab') {
            e.preventDefault();
            this.setActivePane(this.getOppositePaneId());
          } else if (e.key === 'F5') {
            e.preventDefault();
            this.triggerCopy();
          } else if (e.key === 'F6') {
            e.preventDefault();
            this.triggerMove();
          } else if (e.key === 'F7') {
            e.preventDefault();
            this.openNewFolderModal();
          } else if (e.key === 'F2') {
            e.preventDefault();
            this.openRenameModal();
          } else if (e.key === 'Delete') {
            e.preventDefault();
            this.openDeleteModal();
          } else if (e.key === 'Backspace') {
            e.preventDefault();
            this.navigateUp(this.activePane);
          } else if (e.key === 'Enter') {
            const selected = this.getSelectedEntries(this.activePane);
            if (selected.length === 1) {
              this.openEntry(this.activePane, selected[0].name);
            }
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
            e.preventDefault();
            this.toggleSelectAll(this.activePane);
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
            e.preventDefault();
            this.swapPanes();
          }
        });
      }

      bindResizer() {
        const resizer = document.getElementById('pane-resizer');
        const leftPane = document.getElementById('pane-left');
        const rightPane = document.getElementById('pane-right');
        const workspace = document.getElementById('workspace');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
          isResizing = true;
          resizer.classList.add('resizing');
          document.body.style.cursor = 'col-resize';
        });

        window.addEventListener('mousemove', (e) => {
          if (!isResizing) return;
          const rect = workspace.getBoundingClientRect();
          const inspector = document.getElementById('inspector-panel');
          const inspectorWidth = inspector.classList.contains('hidden') ? 0 : inspector.offsetWidth;
          const availableWidth = rect.width - inspectorWidth - resizer.offsetWidth;
          const offsetX = e.clientX - rect.left;
          const leftPercent = Math.min(80, Math.max(20, (offsetX / availableWidth) * 100));

          leftPane.style.flex = `0 0 ${leftPercent}%`;
          rightPane.style.flex = `1 1 0%`;
        });

        window.addEventListener('mouseup', () => {
          if (isResizing) {
            isResizing = false;
            resizer.classList.remove('resizing');
            document.body.style.cursor = '';
          }
        });
      }
    }

    // Boot application
    const app = new CommanderApp();
  </script>
